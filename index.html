  <!-- ─── Fonts ─────────────────────────────────────────────────────────
       Archivo (display/wordmark — variable width + weight, 100..900 so
       the hero can go hairline-thin), Inter (body), JetBrains Mono (utility),
       Share Tech Mono (terminal / preloader)
  ────────────────────────────────────────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <!-- preload the font stylesheet so the browser fetches it in parallel with
       other critical resources rather than waiting for the parser to reach it -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Share+Tech+Mono&display=swap" />
